{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4">Регистрация</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Придумайте логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Придумайте пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Кто вы?</label>
                    <select name="role" class="form-select">
                        <option value="student">Ученик</option>
                        <option value="teacher">Учитель / Админ</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            </form>
            <div class="text-center mt-3">
                <small>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
